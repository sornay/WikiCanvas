<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Canvas</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="wiki.css">
<style>
  #wc-top { display:flex; gap:8px; align-items:center; padding:8px 12px; background:#f6f4ee; border-bottom:1px solid #ddd; }
  #wc-canvas { position:relative; flex:1; overflow:auto; background:#eceae3; min-height:0; }
  body, html { margin:0; height:100%; display:flex; flex-direction:column; }
  .wc-card { position:absolute; width:320px; background:#fffefb; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .wc-card header { cursor:move; padding:8px 10px; font-weight:700; border-bottom:1px solid #eee; display:flex; gap:8px; align-items:center; }
  .wc-card header .sp { flex:1; }
  .wc-card header button { border:1px solid #ddd; background:#fff; border-radius:6px; cursor:pointer; }
  .wc-card .body { padding:8px 10px; max-height:320px; overflow:auto; font-size:14px; }
  .wc-card .body a { color:#3b5bdb; }
  #wc-status { padding:4px 12px; font-size:12px; color:#777; background:#f6f4ee; border-top:1px solid #ddd; }
</style>
</head>
<body>
<div id="wc-top">
  <strong>Wiki Canvas</strong>
  <select id="wc-lang" title="Language">
    <option value="en">English</option>
    <option value="fa">فارسی</option>
    <option value="ar">العربية</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="ja">日本語</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
  </select>
  <input id="wc-q" type="search" placeholder="Search Wikipedia…" size="32">
  <button id="wc-add">Add card</button>
  <span style="flex:1"></span>
  <span style="font-size:12px;color:#777">Ctrl/Shift/middle-click opens in browser</span>
</div>
<div id="wc-canvas"></div>
<div id="wc-status">loading…</div>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
