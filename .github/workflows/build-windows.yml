name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app (NSIS installer)
        run: cargo tauri build -- --bundles nsis

      - name: List bundles (debug)
        if: always()
        run: Get-ChildItem -Recurse src-tauri\target\release\bundle | Select-Object FullName, Length
        shell: pwsh

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v5
        with:
          name: wiki-canvas-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v5
        with:
          name: wiki-canvas-windows-exe
          path: |
            src-tauri/target/release/*.exe
          if-no-files-found: warn
